<!DOCTYPE html>
<html lang="zh‑CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial‑scale=1.0">
    <title>示例HTML页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border‑box;
        }
        body {
            font‑family: system‑ui, sans‑serif;
            background‑color: #f0f4f8;
            display: flex;
            justify‑content: center;
            align‑items: center;
            min‑height: 100vh;
        }
        .box {
            background: #ffffff;
            padding: 40px 50px;
            border‑radius: 16px;
            box‑shadow: 0 4px 20px #00000018;
            text‑align: center;
        }
        h1 {
            color:#222;
            margin‑bottom:16px;
        }
        p {
            color:#555;
            margin‑bottom:24px;
        }
        button {
            padding:12px 26px;
            background‑color:#2563eb;
            color:white;
            border:none;
            border‑radius:8px;
            font‑size:16px;
            cursor:pointer;
        }
        button:hover {
            background‑color:#1d4ed8;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>你好，HTML</h1>
        <p>这是一个完整独立html文件，双击直接打开</p>
        <button onclick="sayHello()">点我测试</button>
    </div>

    <script>
        function sayHello(){
            alert('按钮点击成功！');
        }
    </script>
</body>
</html>
